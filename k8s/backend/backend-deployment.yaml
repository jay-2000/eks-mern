apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: 212105053723.dkr.ecr.ap-south-1.amazonaws.com/mern-backend:${IMAGE_TAG}
        ports:
        - containerPort: 3500

        startupProbe:
          httpGet:
            path: /healthz
            port: 3500
          failureThreshold: 30
          periodSeconds: 5

        readinessProbe:
          httpGet:
            path: /ready
            port: 3500
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /healthz
            port: 3500
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3

        # env:
        # - name: MONGO_CONN_STR
        #   valueFrom:
        #     secretKeyRef:
        #       name: backend-secret
        #       key: MONGO_CONN_STR
        # - name: NODE_ENV
        #   valueFrom:
        #     secretKeyRef:
        #       name: backend-secret
        #       key: NODE_ENV

        env:
        - name: NODE_ENV
          value: "production"

        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: mongo-uri


        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
